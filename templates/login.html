<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Youtuber no Automático</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e8e8e8;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 2.5rem 2rem;
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
    }
    .logo span {
      display: inline-block;
      font-size: 2.2rem;
      margin-bottom: .4rem;
    }
    .logo p {
      font-size: .82rem;
      color: #888;
      margin-top: .25rem;
    }

    label {
      display: block;
      font-size: .82rem;
      color: #999;
      margin-bottom: .35rem;
      margin-top: 1.2rem;
    }

    input {
      width: 100%;
      padding: .75rem 1rem;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #ff3b3b; }

    .error {
      background: #2a0a0a;
      border: 1px solid #5a1a1a;
      color: #ff7070;
      border-radius: 8px;
      padding: .75rem 1rem;
      font-size: .85rem;
      margin-top: 1rem;
    }

    button[type=submit] {
      margin-top: 1.8rem;
      width: 100%;
      padding: .85rem;
      background: #ff3b3b;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    button[type=submit]:hover { background: #e02e2e; }

    .footer { text-align: center; margin-top: 1.5rem; font-size: .78rem; color: #555; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span>🎬</span>
      <h1>Youtuber no Automático</h1>
      <p>Painel de controle</p>
    </div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="email">

      <label for="password">Senha</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>

      <button type="submit">Entrar</button>
    </form>

    <p class="footer">Youtuber no Automático &copy; 2026</p>
  </div>
</body>
</html>
