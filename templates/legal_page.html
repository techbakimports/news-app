<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }} — Youtuber no Automático</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      line-height: 1.7;
    }

    header {
      padding: 1.2rem 1.5rem;
      background: #181818;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: .6rem;
    }
    header span { font-size: 1.4rem; }
    header h1 { font-size: 1rem; font-weight: 700; color: #fff; }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    h1.title { font-size: 1.6rem; color: #fff; margin-bottom: .4rem; }
    .updated { font-size: .82rem; color: #666; margin-bottom: 2rem; }

    h2 {
      font-size: 1.05rem;
      color: #fff;
      margin: 2rem 0 .75rem;
      padding-bottom: .4rem;
      border-bottom: 1px solid #2a2a2a;
    }
    p { font-size: .92rem; color: #ccc; margin-bottom: .9rem; }
    ul { margin: 0 0 .9rem 1.3rem; }
    li { font-size: .92rem; color: #ccc; margin-bottom: .4rem; }
    a { color: #60a5fa; }

    footer {
      text-align: center;
      font-size: .78rem;
      color: #555;
      padding: 2rem 1rem;
    }
  </style>
</head>
<body>
  <header>
    <span>🎬</span>
    <h1>Youtuber no Automático</h1>
  </header>

  <main>
    {{ content | safe }}
  </main>

  <footer>Youtuber no Automático &copy; 2026</footer>
</body>
</html>
